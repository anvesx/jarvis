[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orb-core"
version = "0.1.0"
description = "Shared parts of every orb agent: settings, the Jev reader, the Ollama client, the agent interface and the page loader."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "typesafe-sdk>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]
