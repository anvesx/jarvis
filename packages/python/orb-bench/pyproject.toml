[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orb-bench"
version = "0.1.0"
description = "The orb test bench: git-ignored test audio and scored suites for STT, LLM, TTS and turn-taking."
requires-python = ">=3.12"
dependencies = ["orb-core>=0.1", "numpy>=2", "soundfile>=0.12", "soxr>=0.5", "httpx>=0.27", "transformers>=5.19", "pyarrow>=15"]

[tool.setuptools.packages.find]
where = ["src"]
